name: Verify, Refresh & Deploy

# Mirrors the reference repo's Pages setup, with two changes the expert panel
# forced (docs/EXPERT_PANEL.md ADR-10/11): a hard verify gate, and a WEEKLY
# refresh instead of daily because hackathon records are write-once.

on:
  push:
    branches: [main, 'arena/*']
  pull_request:
  schedule:
    - cron: '0 3 * * 1'        # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      events:
        description: 'how many hackathons to crawl galleries for'
        required: false
        default: '25'
      deep:
        description: 'how many project pages to fetch for depth (polite: ~1.25s each)'
        required: false
        default: '150'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Rebuild deterministically + gates + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Rebuild corpus from committed raw captures (offline, no network)
        run: python3 pipeline/ingest_seed.py --today $(date -u +%F)

      - name: Emit all six read surfaces + agent contract, then verify gates
        run: |
          python3 pipeline/shard_builder.py --check
          python3 pipeline/generate_remixes.py
          python3 pipeline/build_agent_api.py

      - name: Test suite (taxonomy, surfaces, parity, ethics gate, parsers, MCP)
        run: python3 pipeline/tests/test_pipeline.py

      - name: Fail if committed artifacts drifted from reproducible build
        run: |
          if [ -n "$(git status --porcelain web/public pipeline/corpus.jsonl)" ]; then
            echo "::error::build output differs from committed artifacts — run 'make build' and commit";
            git status --porcelain web/public pipeline/corpus.jsonl; exit 1;
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build the explorer
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist

  harvest:
    name: Refresh corpus from Devpost (weekly / manual only)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # No secrets required: the public API needs no key. We commit data back only
      # when it actually changed, and a parse-drift tripwire fails the job loudly
      # rather than publishing an empty catalog (ADR-10).
      - name: Harvest, enrich, repack
        run: |
          python3 pipeline/harvest_devpost.py all \
            --events "${{ github.event.inputs.events || 25 }}" \
            --deep "${{ github.event.inputs.deep || 150 }}"
          python3 pipeline/shard_builder.py --check
          python3 pipeline/generate_remixes.py
          python3 pipeline/build_agent_api.py
          python3 pipeline/tests/test_pipeline.py

      - name: Commit refreshed corpus
        run: |
          git config user.name  "ideas-galore-bot"
          git config user.email "bot@users.noreply.github.com"
          git add pipeline/corpus.jsonl pipeline/raw web/public || true
          if ! git diff --cached --quiet; then
            git commit -m "chore(harvest): refresh corpus $(date -u +%F) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "no upstream changes — corpus already current"
          fi

  deploy:
    name: Deploy to GitHub Pages
    needs: [verify, harvest]
    if: always() && needs.verify.result == 'success' && (needs.harvest.result == 'success' || needs.harvest.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
